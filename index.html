<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Configuration PWA iOS (Mode Plein Écran sans barres Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --panel-bg: rgba(22, 22, 26, 0.85);
      --accent: #ff2a85;
      --accent-hover: #e01b70;
      --text-light: #ffffff;
      --text-dim: #a0a0ab;
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-light);
    }

    /* Alerte si l'iPhone est tenu en mode Portrait */
    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    #orientation-warning svg {
      width: 64px;
      height: 64px;
      fill: var(--accent);
      margin-bottom: 1rem;
      animation: rotatePhone 2s infinite ease-in-out;
    }

    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    @media screen and (orientation: portrait) {
      #orientation-warning {
        display: flex;
      }
    }

    /* Conteneur Principal optimisé 896x414 (19.5:9) */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Zone de cadrage : 4:3 par défaut pour utiliser 100% du capteur Grand Angle sans effet zoom */
    #stage {
      position: relative;
      height: 100%;
      aspect-ratio: 4 / 3;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    #stage.mode-16-9 {
      aspect-ratio: 16 / 9;
    }

    #stage.mode-full {
      width: 100%;
      aspect-ratio: auto;
    }

    #video-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Effet miroir par défaut pour caméra avant */
    }

    #video-stream.rear-camera {
      transform: scaleX(1);
    }

    /* Calque PNG transparent superposé en temps réel */
    #overlay-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    /* Contrôles flottants (tenant compte de l'encoche iPhone 11) */
    .ui-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: max(16px, var(--safe-top));
      padding-bottom: max(16px, var(--safe-bottom));
      padding-left: max(24px, var(--safe-left));
      padding-right: max(24px, var(--safe-right));
    }

    /* Barre latérale gauche : Réglages discrets */
    .left-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.9);
      background: rgba(255, 42, 133, 0.6);
    }

    /* Barre latérale droite : Bouton Déclencheur */
    .right-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      border: 4px solid #ffffff;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s ease;
    }

    #shutter-btn:active {
      transform: scale(0.92);
    }

    #shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent);
      transition: background 0.2s;
    }

    /* Décompte Visuel (3, 2, 1, Cheese!) */
    #countdown-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    #countdown-text {
      font-size: 7rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 6px 30px rgba(0, 0, 0, 0.8);
      transform: scale(1);
      animation: pulseCount 0.9s infinite ease-out;
    }

    @keyframes pulseCount {
      0% { transform: scale(0.6); opacity: 0; }
      40% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    /* Effet Flash Blanc */
    #flash-overlay {
      position: fixed;
      inset: 0;
      background: #ffffff;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;

    /* Écran de Résultat Post-Capture */

      inset: 0;
      z-index: 50;
      background: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      flex-direction: row;
      align-items: center;
      justify-content: space-between;

      padding-bottom: max(16px, var(--safe-bottom));
      padding-left: max(24px, var(--safe-left));
      padding-right: max(24px, var(--safe-right));
      gap: 20px;
    }

    .result-photo-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #final-photo {

      border: 2px solid rgba(255, 255, 255, 0.15);
      object-fit: contain;

    .result-sidebar {
      width: 260px;
      height: 100%;
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .qr-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-light);
    }

    #qr-container {
      width: 150px;
      height: 150px;
      background: #ffffff;
      padding: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #qr-container img, #qr-container canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .loader-spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(255, 42, 133, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;

    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #upload-status {
      font-size: 0.78rem;
      color: var(--text-dim);
      margin-top: 8px;
      min-height: 2.2em;
    }

    .action-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:active {
      background: var(--accent-hover);
    }

    /* Modale d'Administration (Upload PNG & URL Webhook) */
    #admin-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.85);

      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-card {
      background: #18181c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);

    .admin-header h2 {
      font-size: 1.1rem;

    .form-group {
      display: flex;

    .form-group label {
      font-size: 0.82rem;

    .form-group input[type="text"],
    .form-group input[type="file"] {
      background: #0e0e11;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
    }

    .admin-row {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);

      font-size: 0.85rem;

      background: rgba(255, 70, 70, 0.15);
      color: #ff6b6b;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Canvas invisible pour le rendu final haute résolution */
    #capture-canvas {
      display: none;
    }
  </style>
</head>

  <!-- Canvas caché pour le rendu final haute résolution -->

  <script>
    const DEFAULT_GAS_WEBHOOK_URL = "";

    let currentFacingMode = "user"; // "user" (avant) ou "environment" (arrière)
    let currentAspectMode = "4:3";  // "4:3" (Grand angle natif sans zoom), "16:9", ou "FULL"
    let mediaStream = null;
    let isCapturing = false;

    // Références DOM
    const stageEl = document.getElementById("stage");
    const videoEl = document.getElementById("video-stream");
    const overlayPreviewEl = document.getElementById("overlay-preview");
    const shutterBtn = document.getElementById("shutter-btn");
    const ratioBtn = document.getElementById("ratio-btn");
    const switchCamBtn = document.getElementById("switch-cam-btn");
    const countdownOverlay = document.getElementById("countdown-overlay");
    const countdownText = document.getElementById("countdown-text");
    const flashOverlay = document.getElementById("flash-overlay");
    const captureCanvas = document.getElementById("capture-canvas");

    const resultModal = document.getElementById("result-modal");
    const finalPhotoEl = document.getElementById("final-photo");
    const qrContainer = document.getElementById("qr-container");
    const uploadStatusEl = document.getElementById("upload-status");
    const retakeBtn = document.getElementById("retake-btn");

    const adminModal = document.getElementById("admin-modal");
    const openAdminBtn = document.getElementById("open-admin-btn");
    const closeAdminBtn = document.getElementById("close-admin-btn");
    const gasUrlInput = document.getElementById("gas-url-input");
    const overlayFileInput = document.getElementById("overlay-file-input");
    const saveAdminBtn = document.getElementById("save-admin-btn");
    const clearOverlayBtn = document.getElementById("clear-overlay-btn");

    /**
     * ============================================================================
     * PERSISTANCE INDEXEDDB POUR LE CALQUE PNG
     * ============================================================================
     */
    const DB_NAME = "PhotoboothDB";
    const STORE_NAME = "SettingsStore";

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveOverlayToDB(dataUrl) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(dataUrl, "overlayPng");
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadOverlayFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get("overlayPng");
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteOverlayFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete("overlayPng");
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    /**
     * ============================================================================
     * INITIALISATION CAMÉRA GRAND ANGLE NATIF 4:3 (Zéro recadrage capteur iOS)
     * ============================================================================
     */
    async function initCamera(facingMode = "user") {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      // Le ratio 4:3 (1440x1080) active tout le capteur photo de l'iPhone 11 sans le crop vidéo 16:9
      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1440 },
          height: { ideal: 1080 },
          aspectRatio: { ideal: 4 / 3 }
        }
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = mediaStream;

        // Force le zoom matériel au minimum (Grand Angle maximal) si supporté
        const videoTrack = mediaStream.getVideoTracks()[0];
        if (videoTrack && videoTrack.getCapabilities) {
          const caps = videoTrack.getCapabilities();
          if (caps.zoom) {
            try {
              await videoTrack.applyConstraints({ advanced: [{ zoom: caps.zoom.min || 1 }] });
            } catch (_) {}
          }
        }

        if (facingMode === "environment") {
          videoEl.classList.add("rear-camera");
        } else {
          videoEl.classList.remove("rear-camera");
        }
      } catch (err) {
        alert("Erreur d'accès à la caméra : " + err.message);
      }
    }

    // Bouton permettant de choisir entre 4:3 (Grand angle total), 16:9 et Plein écran
    ratioBtn.addEventListener("click", () => {
      stageEl.classList.remove("mode-16-9", "mode-full");
      if (currentAspectMode === "4:3") {
        currentAspectMode = "16:9";
        stageEl.classList.add("mode-16-9");
        ratioBtn.textContent = "16:9";
      } else if (currentAspectMode === "16:9") {
        currentAspectMode = "FULL";
        stageEl.classList.add("mode-full");
        ratioBtn.textContent = "FULL";
      } else {
        currentAspectMode = "4:3";
        ratioBtn.textContent = "4:3";
      }
    });

    /**
     * ============================================================================
     * TÉLÉCOMMANDE BLUETOOTH (Touches HID / Enter / Space / MediaSession)
     * ============================================================================
     */
    function triggerFromRemote() {
      if (adminModal.style.display === "flex") return;

      // Si une photo est déjà affichée avec son QR Code, la télécommande relance une nouvelle photo
      if (resultModal.style.display === "flex") {
        resultModal.style.display = "none";
        finalPhotoEl.src = "";
        setTimeout(() => startPhotoboothSequence(), 250);
        return;
      }

      startPhotoboothSequence();
    }

    window.addEventListener("keydown", (e) => {
      if (adminModal.style.display === "flex") return;
      const validKeys = ["Enter", " ", "Spacebar", "AudioVolumeUp", "AudioVolumeDown", "VolumeUp", "VolumeDown", "Camera"];
      if (validKeys.includes(e.key) || validKeys.includes(e.code) || e.keyCode === 13 || e.keyCode === 32) {
        e.preventDefault();
        triggerFromRemote();
      }
    });

    /**
     * ============================================================================
     * DÉCOMPTE VISUEL & CAPTURE PHOTO HAUTE RÉSOLUTION
     * ============================================================================
     */
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startPhotoboothSequence() {
      if (isCapturing) return;
      isCapturing = true;

      countdownOverlay.style.display = "flex";
      const steps = ["3", "2", "1", "CHEESE !"];
      for (const step of steps) {
        countdownText.textContent = step;
        countdownText.style.animation = "none";
        void countdownText.offsetWidth;
        countdownText.style.animation = "pulseCount 0.9s ease-out";
        await sleep(900);
      }
      countdownOverlay.style.display = "none";

      flashOverlay.style.opacity = "1";
      setTimeout(() => {
        flashOverlay.style.opacity = "0";
      }, 150);

      const base64Image = await composeImageOnCanvas();

      finalPhotoEl.src = base64Image;
      resultModal.style.display = "flex";

      await uploadToGoogleDrive(base64Image);

      isCapturing = false;
    }

    async function composeImageOnCanvas() {
      const ctx = captureCanvas.getContext("2d");

      // Respecte le format sélectionné (1440x1080 en 4:3 grand angle, ou 1920x1080 en 16:9)
      const targetWidth = currentAspectMode === "4:3" ? 1440 : 1920;
      const targetHeight = 1080;
      captureCanvas.width = targetWidth;
      captureCanvas.height = targetHeight;

      const vWidth = videoEl.videoWidth || 1440;
      const vHeight = videoEl.videoHeight || 1080;

      const targetRatio = targetWidth / targetHeight;
      const videoRatio = vWidth / vHeight;

      let sx = 0, sy = 0, sWidth = vWidth, sHeight = vHeight;

      if (videoRatio > targetRatio) {
        sWidth = vHeight * targetRatio;
        sx = (vWidth - sWidth) / 2;
      } else {
        sHeight = vWidth / targetRatio;
        sy = (vHeight - sHeight) / 2;
      }

      ctx.save();
      if (currentFacingMode === "user") {
        ctx.translate(targetWidth, 0);
        ctx.scale(-1, 1);
      }

      ctx.drawImage(
        videoEl,
        sx, sy, sWidth, sHeight,
        0, 0, targetWidth, targetHeight
      );
      ctx.restore();

      if (overlayPreviewEl.src && overlayPreviewEl.style.display !== "none") {
        await new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
            resolve();
          };
          img.onerror = () => resolve();
          img.src = overlayPreviewEl.src;
        });
      }

      return captureCanvas.toDataURL("image/jpeg", 0.90);
    }

    /**
     * ============================================================================
     * UPLOAD VERS GOOGLE APPS SCRIPT & GÉNÉRATION DU QR CODE (INCHANGÉ)
     * ============================================================================
     */
    async function uploadToGoogleDrive(base64DataUrl) {
      qrContainer.innerHTML = '<div class="loader-spinner"></div>';
      uploadStatusEl.textContent = "Sauvegarde sur Google Drive...";

      const webhookUrl = localStorage.getItem("photobooth_gas_url") || DEFAULT_GAS_WEBHOOK_URL;

      if (!webhookUrl) {
        qrContainer.innerHTML = '<span style="color:#ff4b4b; font-size:0.75rem; font-weight:700;">URL Webhook manquante</span>';
        uploadStatusEl.textContent = "Configurez l'URL Google Apps Script via la roue crantée.";
        return;
      }

      try {
        const payload = {
          image: base64DataUrl,
          filename: `Photobooth_${new Date().toISOString().replace(/[:.]/g, "-")}.jpg`,
          mimeType: "image/jpeg"
        };

        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success" && result.downloadUrl) {
          qrContainer.innerHTML = "";
          new QRCode(qrContainer, {
            text: result.downloadUrl,
            width: 130,
            height: 130,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
          uploadStatusEl.textContent = "Scannez avec l'appareil photo de votre téléphone !";
        } else {
          throw new Error(result.message || "Réponse invalide du serveur");
        }
      } catch (err) {
        console.error("Erreur Upload Drive:", err);
        qrContainer.innerHTML = '<span style="color:#ff4b4b; font-size:0.75rem;">Erreur Réseau</span>';
        uploadStatusEl.textContent = "Échec de l'envoi : " + err.message;
      }
    }

    /**
     * ============================================================================
     * GESTION DES ÉVÉNEMENTS & ADMINISTRATION
     * ============================================================================
     */
    shutterBtn.addEventListener("click", startPhotoboothSequence);

    retakeBtn.addEventListener("click", () => {
      resultModal.style.display = "none";
      finalPhotoEl.src = "";
    });

    switchCamBtn.addEventListener("click", () => {
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      initCamera(currentFacingMode);
    });

    openAdminBtn.addEventListener("click", () => {
      gasUrlInput.value = localStorage.getItem("photobooth_gas_url") || DEFAULT_GAS_WEBHOOK_URL;
      adminModal.style.display = "flex";
    });

    closeAdminBtn.addEventListener("click", () => {
      adminModal.style.display = "none";
    });

    saveAdminBtn.addEventListener("click", async () => {
      const trimmedUrl = gasUrlInput.value.trim();
      localStorage.setItem("photobooth_gas_url", trimmedUrl);

      const file = overlayFileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const dataUrl = e.target.result;
          await saveOverlayToDB(dataUrl);
          overlayPreviewEl.src = dataUrl;
          overlayPreviewEl.style.display = "block";
          adminModal.style.display = "none";
        };
        reader.readAsDataURL(file);
      } else {
        adminModal.style.display = "none";
      }
    });

    clearOverlayBtn.addEventListener("click", async () => {
      await deleteOverlayFromDB();
      overlayPreviewEl.src = "";
      overlayPreviewEl.style.display = "none";
      overlayFileInput.value = "";
      alert("Le cadre PNG a été retiré.");
    });

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const savedOverlay = await loadOverlayFromDB();
        if (savedOverlay) {
          overlayPreviewEl.src = savedOverlay;
          overlayPreviewEl.style.display = "block";
        }
      } catch (e) {
        console.warn("Impossible de charger le calque depuis IndexedDB:", e);
      }

      await initCamera(currentFacingMode);
    });
  </script>
</body>
</html>
